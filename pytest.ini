[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v -s --tb=short
markers =
    eval: DeepEval automated LLM evaluation pipeline tests
    unit: Fast unit tests for components
    guardrails: Security, PII, and safety guardrail tests
