name: DeepEval AI Regression & Evaluation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-rag-system:
    name: Run DeepEval Metric Evaluation & SLA Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies & FinSight Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio deepeval rank-bm25 numpy rich

      - name: Run Component Unit Tests
        run: |
          pytest tests/test_agent_unit.py -v

      - name: Run DeepEval LLM Evaluation Benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'mock' }}
          CONFIDENT_AI_API_KEY: ${{ secrets.CONFIDENT_AI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          deepeval test run tests/test_deepeval_eval.py

      - name: Generate Evaluation Summary Report
        if: always()
        run: |
          echo "### 🚀 DeepEval Automated Evaluation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Evaluation Model**: gpt-4o-mini (Deterministic Fallback supported)" >> $GITHUB_STEP_SUMMARY
          echo "- **Metric Quality Gates**: Faithfulness (>=0.85), Answer Relevancy (>=0.70), Hallucination (<=0.15)" >> $GITHUB_STEP_SUMMARY
          echo "- **SLA Thresholds**: Latency < 4.0s, Cost < $0.03/query" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Quality gates verified." >> $GITHUB_STEP_SUMMARY

